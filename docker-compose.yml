services:
  postgres:
    image: postgres:16-alpine
    container_name: certix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certix
      POSTGRES_PASSWORD: certix_dev_password
      POSTGRES_DB: certix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certix -d certix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: certix_api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://certix:certix_dev_password@postgres:5432/certix
      REDIS_URL: redis://redis:6379/0
      CERTIFICATE_STORAGE_DIR: /app/storage/generated
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - certix_storage:/app/storage/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: certix_worker
    restart: unless-stopped
    command: rq worker certix_jobs --url redis://redis:6379/0
    environment:
      APP_ENV: development
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://certix:certix_dev_password@postgres:5432/certix
      REDIS_URL: redis://redis:6379/0
      CERTIFICATE_STORAGE_DIR: /app/storage/generated
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - certix_storage:/app/storage/generated
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  certix_storage:
